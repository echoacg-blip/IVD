name: IVD research brief
on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'
    - cron: '0 10 * * *'
permissions:
  contents: write
concurrency:
  group: ivd-research-brief
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/ivd-brief.py
      - run: |
          git add docs/briefs
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Refresh IVD brief"
          git push

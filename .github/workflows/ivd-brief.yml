name: IVD research brief
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/ivd-brief.py'
      - '.github/workflows/ivd-brief.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'
    - cron: '0 10 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ivd-research-brief
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name != 'push'
        run: python scripts/ivd-brief.py
      - run: |
          git add docs/briefs
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Refresh IVD brief"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4

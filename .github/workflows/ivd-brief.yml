name: IVD research brief
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/ivd-brief.py'
      - '.github/workflows/ivd-brief.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'
    - cron: '0 10 * * *'
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ivd-research-brief
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh briefs
        run: python scripts/ivd-brief.py
      - run: |
          git add docs/briefs
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Refresh IVD brief"
          if ! git push; then
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4

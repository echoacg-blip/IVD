name: IVD research brief
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/ivd-brief.py'
      - '.github/workflows/ivd-brief.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'
    - cron: '0 10 * * *'
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ivd-research-brief
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh briefs
        if: github.event_name != 'push'
        run: python scripts/ivd-brief.py
      - name: Verify brief archive
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("docs/briefs")
          dates = json.loads((root / "index.json").read_text(encoding="utf-8"))
          if not isinstance(dates, list) or not dates or dates != sorted(set(dates), reverse=True):
              raise SystemExit("Invalid brief index")
          for day in dates:
              if not re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", day):
                  raise SystemExit(f"Invalid edition date: {day}")
              edition = json.loads((root / f"{day}.json").read_text(encoding="utf-8"))
              if edition.get("date") != day or not edition.get("items"):
                  raise SystemExit(f"Missing or empty edition: {day}")
              for item in edition["items"]:
                  if not all(item.get(key) for key in ("title", "category", "source", "url")):
                      raise SystemExit(f"Incomplete entry in edition: {day}")
          print(f"Verified {len(dates)} editions")
          PY
      - name: Save refreshed briefs
        if: github.event_name != 'push'
        run: |
          git add docs/briefs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh IVD brief"
          if ! git push; then
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
